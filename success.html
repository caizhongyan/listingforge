<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>支付成功 — ListingForge</title>
<link href="/style.css" rel="stylesheet">
<script src="/track.js"></script>
</head>
<body>
<div class="wrap" style="max-width:560px;text-align:center;padding-top:80px">
  <div class="card">
    <h1 style="color:var(--accent)">✓ 支付成功</h1>
    <p id="msg" class="sub">正在验证您的订单…</p>
    <div id="done" hidden style="text-align:left;margin-top:10px">
      <div class="block-head"><span>你的解锁码（请复制保存）</span><button class="copy" id="copyCode">复制</button></div>
      <textarea id="codeBox" rows="3" readonly></textarea>
      <p class="sub" style="font-size:12px;margin:8px 0 0">
        长期有效，不限次数。换电脑、清缓存或换浏览器后，回到首页底部点「解锁码 / 恢复购买」粘贴此码即可恢复完整版。
      </p>
    </div>
    <p style="margin-top:18px"><a class="primary" href="/?paid=1" id="goBtn">开始生成文案</a></p>
  </div>
  <footer class="foot">
    <a href="/">ListingForge</a> · 需要帮助？
    <div><a href="/privacy.html">隐私政策</a> · <a href="/terms.html">服务条款</a> · support@skuwrite.com</div>
    <div class="legal">Operated by CZY Tools (Zhongyan Cai), sole proprietorship, Wuhan, China.</div>
  </footer>
</div>
<script>
  const params = new URLSearchParams(location.search);
  const track = (n, p) => { try { window.pp && window.pp.track && window.pp.track(n, p); } catch (e) {} };
  track('purchase_return');
  fetch('/api/verify?' + params.toString())
    .then(r => r.json())
    .then(j => {
      const msg = document.getElementById('msg');
      if (j.ok && j.token) {
        localStorage.setItem('lf_token', j.token);
        track('purchase_verified');
        msg.textContent = '已解锁，完整功能已开通。';
        // 把解锁码亮出来让用户保存——这是换设备后唯一的恢复凭据
        const box = document.getElementById('codeBox');
        box.value = j.token;
        document.getElementById('done').hidden = false;
        document.getElementById('copyCode').addEventListener('click', function () {
          const self = this;
          const done = () => { self.textContent = '已复制'; setTimeout(() => { self.textContent = '复制'; }, 1500); };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(j.token).then(done, () => { box.select(); document.execCommand('copy'); done(); });
          } else { box.select(); document.execCommand('copy'); done(); }
        });
      } else {
        track('purchase_verify_failed', { reason: String(j.error || 'no_token').slice(0, 40) });
        msg.textContent = '验证失败。若已扣款，请邮件联系 support@skuwrite.com 并附订单号。';
      }
    })
    .catch(() => {
      track('purchase_verify_failed', { reason: 'network' });
      document.getElementById('msg').textContent = '网络错误，请返回首页重试。';
    });
</script>
</body>
</html>
